scenario: INJ-01
process: 사출
title: 사출 샷 단위 양불 판정 (KAMP 650톤 CN7, LH·RH 합친 샷 기준)
question: 방금 나온 샷이 불량인가?
data_root: ../..

unit:
  type: table
  path: 사출/04. Dataset_Molding/dataset/labeled_data.csv
  pre_filters:             # 합치기 전에 설비·품번 한정
    - {column: EQUIP_NAME, eq: 650톤-우진2호기}
    - {column: PART_NAME, in: ["CN7 W/S SIDE MLD'G LH", "CN7 W/S SIDE MLD'G RH"]}
  collapse:                # 2캐비티 금형: 한 샷에 LH·RH가 같은 공정값으로 기록되고, 같은 _id 행이 두 번씩 들어 있음
    dedupe: [_id]          # 완전 중복 행 제거
    key: TimeStamp         # 같은 시각 = 같은 샷
    any: {PassOrFail: [N]} # LH·RH 중 하나라도 불량이면 불량 샷

task: binary
label:
  source: column
  column: PassOrFail
  positive: [N]

features:
  exclude: [_id, TimeStamp, PART_FACT_PLAN_DATE, PART_FACT_SERIAL, PART_NAME, EQUIP_CD, EQUIP_NAME, Reason, rows_merged]

derive:
  - {name: work_date, from: TimeStamp, fn: date}

split:
  method: group            # 작업일 단위로 묶음. 불량이 하루 3~4일에 몰려 있어 시간순 30% 분할은 평가 불량이 2건뿐
  group: work_date
  test_groups: ["2020-10-27"]

model:
  candidates: [logistic, random_forest, hgb, milg]

decision:
  type: threshold_for_recall
  target_recall: 0.8
  warn_ratio: 0.5

output:
  carry_columns: [TimeStamp, work_date, PART_NAME]

notes:
  - 원본 6,736행은 실제로 1,995샷(LH·RH 중복 기록). 불량 샷은 20개, 평가일 10/27의 불량 샷은 5개뿐이다.
  - 평가일 하나로는 표본이 너무 작아 experiments/inj_day_holdout.py로 불량이 있는 날 3개를 번갈아 평가한다.
  - 같은 샷인데 LH·RH 라벨이 다른 경우가 있어(한쪽만 불량), 공정값만으로 맞힐 수 있는 상한이 있다.
  - Reason(불량 사유)은 판정 이후 기록이라 특성에서 뺐다.
