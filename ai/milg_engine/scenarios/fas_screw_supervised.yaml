scenario: FAS-02
process: 체결
title: 나사 체결 불량 분류 — 불량 사례로 학습, 처음 보는 불량 종류로 평가 (pyscrew s04)
question: 과거 불량 사례로 배운 모델이 처음 보는 종류의 체결 불량도 잡는가?
data_root: ../..
unit:
  type: files
  root: 체결/체결-20261111T065034Z-1-003/체결/s04_variations-in-assembly-conditions-2/json
  glob: '*/*.json'
  path_regex: ^(?P<fault_class>[^/]+)/(?P<file_name>[^/]+\.json)$
  reader: pyscrew_json
  segment_column: step
  channels:
  - torque
  - angle
  - gradient
  stats:
  - mean
  - std
  - max
  - min
  - last
  - len
  attach:
  - path: 체결/체결-20261111T065034Z-1-003/체결/s04_variations-in-assembly-conditions-2/labels.csv
    unit_key: file_name
    columns:
    - scenario_condition
    - workpiece_result
    - workpiece_date
    - workpiece_location
task: binary
features:
  exclude:
  - fault_class
  - file_name
  - workpiece_result
  - workpiece_date
  - workpiece_location
split:
  method: group
  group: fault_class
  test_size: 0.3
  seed: 3
audit:
  watch:
  - torque
  - angle
output:
  carry_columns:
  - fault_class
  - workpiece_result
  - scenario_condition
notes:
- 불량 종류(fault_class) 단위로 나눠, 평가에 쓰인 불량 종류는 학습에서 한 번도 보지 못한다.
- 대조군(001_control-group)은 "faulty" 표시가 있어도 실제 불량을 넣지 않은 대조 실험이라 뺐다.
filters:
- column: fault_class
  not_in:
  - 001_control-group
label:
  source: column
  column: scenario_condition
  positive:
  - faulty
model:
  candidates:
  - logistic
  - random_forest
  - hgb
  - milg
decision:
  type: threshold_for_recall
  target_recall: 0.5
